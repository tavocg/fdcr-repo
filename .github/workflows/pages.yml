name: Build and deploy package repository

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$GPG_PRIVATE_KEY" \
            | gpg --batch --import

      - name: Verify signing key
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --batch --list-secret-keys "$GPG_KEY_ID"

      - name: Build signed repositories
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          nix run .#build-public -- --sign

      - name: Export public GPG key
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          gpg --armor --export "$GPG_KEY_ID" > public/fdcr.asc

      - name: Disable Jekyll
        run: |
          touch public/.nojekyll

      - name: Show generated files
        run: |
          find public -maxdepth 5 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
